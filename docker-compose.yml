services:

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: anomalydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    command: uvicorn api:app --host 0.0.0.0 --port 8080 --reload
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/anomalydb
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  producer:
    build: .
    restart: unless-stopped
    command: python price_producer.py
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  consumer:
    build: .
    restart: unless-stopped
    command: python price_consumer.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/anomalydb
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  detector:
    build: .
    restart: unless-stopped
    command: python detection_loop.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/anomalydb
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started

  drift:
    build: .
    restart: unless-stopped
    # Re-checks input data drift on a schedule (hourly here; daily in production).
    # Logs PSI per feature and emails on critical drift when SMTP_* are set.
    command: ["sh", "-c", "while true; do python drift_detector.py; sleep 3600; done"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/anomalydb
    depends_on:
      postgres:
        condition: service_healthy

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.12.0
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: >
      mlflow server
        --backend-store-uri sqlite:////mlruns/mlflow.db
        --serve-artifacts
        --artifacts-destination /mlruns
        --host 0.0.0.0
        --allowed-hosts localhost:5000,127.0.0.1:5000,mlflow:5000
    volumes:
      - mlruns:/mlruns

  grafana:
    image: grafana/grafana:10.2.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  mlruns:
  grafana_data:
