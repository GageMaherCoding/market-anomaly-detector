name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-quality:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (pytest)
        run: pytest

  dbt:
    name: dbt build & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: anomalydb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dbt
        # Pin to the 1.9 line. dbt-postgres 1.10 pulls dbt-core 2.0 ("Fusion"),
        # which dropped the Postgres adapter; its dependency marker also drags in
        # a 2.0 pre-release. Upper bounds keep CI on the last Postgres-supporting
        # release.
        run: pip install "dbt-core>=1.9,<1.10" "dbt-postgres>=1.9,<1.10"
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply schema and seed sample data
        env:
          PGPASSWORD: password
        run: |
          psql -h localhost -U postgres -d anomalydb -f schema.sql
          psql -h localhost -U postgres -d anomalydb -f ci/seed.sql
      - name: Write dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          market_anomaly:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 5432
                user: postgres
                password: password
                dbname: anomalydb
                schema: dbt_ci
                threads: 4
          EOF
      - name: dbt build (run models + run tests)
        working-directory: market_anomaly
        run: dbt build
